<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - QL Ca Làm</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
</head>
<body class="bg-[#fbf8f4] text-[#18181b] min-h-screen flex items-center justify-center p-4 sm:p-6 selection:bg-amber-100 selection:text-amber-900">

    <div class="w-full max-w-[440px]">
        <!-- LOGIN CARD (IMAGE 3) -->
        <div class="auth-card p-8 sm:p-10 fade-in">
            <!-- Header with Logo -->
            <div class="text-center mb-6">
                <a href="/" class="inline-flex items-center gap-2.5 mb-4 group">
                    <div class="w-9 h-9 rounded-xl bg-[#cf6800] flex items-center justify-center text-white shadow-md shadow-orange-500/20 group-hover:scale-105 transition-transform">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                            <path d="M2 21h18v-2H2v2zM20 8h-2V5h2c1.1 0 2 .9 2 2v1c0 1.1-.9 2-2 2zm0-5H4c-1.1 0-2 .9-2 2v10c0 2.2 1.8 4 4 4h10c2.2 0 4-1.8 4-4v-3h2c2.2 0 4-1.8 4-4V7c0-2.2-1.8-4-4-4zm-4 12c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2V5h12v10z"/>
                        </svg>
                    </div>
                    <span class="text-lg font-bold tracking-tight text-[#18181b]">QL Ca Làm</span>
                </a>
                <h1 class="text-2xl font-extrabold text-[#18181b] tracking-tight">Đăng nhập</h1>
                <p class="text-sm text-[#71717a] mt-1.5">Chào mừng trở lại! Vui lòng nhập thông tin của bạn</p>
            </div>

            <!-- Login Form -->
            <form id="form-login" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-[#27272a] mb-1.5" for="login-identifier">
                        Email / Số điện thoại
                    </label>
                    <input type="text" id="login-identifier" required
                           class="form-input"
                           placeholder="Nhập email hoặc số điện thoại" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-[#27272a] mb-1.5" for="login-password">
                        Mật khẩu
                    </label>
                    <div class="relative">
                        <input type="password" id="login-password" required
                               class="form-input pr-11"
                               placeholder="Nhập mật khẩu" />
                        <button type="button" class="btn-toggle-pw absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none" data-target="login-password" title="Hiện/ẩn mật khẩu">
                            <svg class="icon-eye w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg class="icon-eye-off w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2 cursor-pointer text-sm text-[#52525b]">
                        <input type="checkbox" id="login-remember" class="w-4 h-4 rounded border-gray-300 accent-[#cf6800]" />
                        <span>Ghi nhớ mật khẩu</span>
                    </label>
                    <a href="/forgot-password" class="text-sm font-semibold text-[#cf6800] hover:text-[#b45309] hover:underline">
                        Quên mật khẩu?
                    </a>
                </div>

                <button type="submit" class="btn-primary w-full py-3.5 text-base mt-2">
                    Đăng nhập
                </button>
            </form>

            <div class="mt-7 text-center text-sm text-[#71717a]">
                Chưa có tài khoản?
                <a href="/register" class="font-bold text-[#cf6800] hover:text-[#b45309] hover:underline ml-1">
                    Đăng ký ngay
                </a>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
