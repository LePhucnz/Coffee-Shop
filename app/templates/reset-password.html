<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mật khẩu mới - QL Ca Làm</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
</head>
<body class="bg-[#fbf8f4] text-[#18181b] min-h-screen flex items-center justify-center p-4 sm:p-6 selection:bg-amber-100 selection:text-amber-900">

    <div class="w-full max-w-[440px]">
        <!-- RESET PASSWORD CARD (IMAGE 5) -->
        <div class="auth-card p-8 sm:p-10 fade-in">
            <!-- Icon Badge at Top -->
            <div class="text-center mb-6">
                <div class="w-14 h-14 rounded-full bg-[#fef3c7] text-[#cf6800] flex items-center justify-center mx-auto mb-4">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M21 2l-2 2m-2-2l2 2m-2 2l2-2m-2 2l-3 3-1-1-2 2 1 1-3 3-1-1-2 2 1 1-5 5a5 5 0 11-7-7l5-5 1 1 2-2-1-1 3-3 1 1 2-2-1-1 3-3z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold text-[#18181b] tracking-tight">Mật khẩu mới</h1>
                <p class="text-sm text-[#71717a] mt-2 leading-relaxed">
                    Vui lòng đặt mật khẩu mới của bạn và hãy đảm bảo bảo mật cho tài khoản của mình.
                </p>
            </div>

            <!-- Reset Password Form -->
            <form id="form-reset" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-[#27272a] mb-1.5" for="reset-password">
                        Mật khẩu mới
                    </label>
                    <div class="relative">
                        <input type="password" id="reset-password" required minlength="8"
                               class="form-input pr-11"
                               placeholder="Tối thiểu 8 ký tự" />
                        <button type="button" class="btn-toggle-pw absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none" data-target="reset-password" title="Hiện/ẩn mật khẩu">
                            <svg class="icon-eye w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg class="icon-eye-off w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-[#27272a] mb-1.5" for="reset-confirm-password">
                        Xác nhận mật khẩu
                    </label>
                    <div class="relative">
                        <input type="password" id="reset-confirm-password" required minlength="8"
                               class="form-input pr-11"
                               placeholder="Nhập lại mật khẩu mới" />
                        <button type="button" class="btn-toggle-pw absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none" data-target="reset-confirm-password" title="Hiện/ẩn mật khẩu">
                            <svg class="icon-eye w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg class="icon-eye-off w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary w-full py-3.5 text-base mt-2">
                    Xác nhận
                </button>
            </form>

            <div class="mt-7 text-center">
                <a href="/login" class="inline-flex items-center gap-1.5 text-sm font-semibold text-[#27272a] hover:text-[#cf6800] transition-colors">
                    <span>←</span> Quay lại đăng nhập
                </a>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
