{% extends "_layout.html" %}

{% block content %}
<!-- Header -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-[#f0e9df]">
    <div>
        <h1 class="text-3xl font-extrabold text-[#18181b] tracking-tight">Đăng ký ca làm</h1>
        <p class="text-sm text-[#71717a] mt-1 font-medium">Chọn các ca bạn rảnh trong tuần. Quản lý sẽ ưu tiên xếp ca theo nguyện vọng này.</p>
    </div>
</div>

<!-- Chọn tuần -->
<div class="flex flex-wrap items-center justify-between gap-3 mt-6">
    <div class="flex items-center gap-2">
        <button type="button" id="week-prev" class="btn-outline-brand px-3" title="Tuần trước">&larr;</button>
        <div class="px-4 py-2 rounded-xl bg-white border border-[#e6dfd5] text-sm font-bold whitespace-nowrap">
            Tuần <span id="week-label">...</span>
        </div>
        <button type="button" id="week-next" class="btn-outline-brand px-3" title="Tuần sau">&rarr;</button>
    </div>
    <span id="reg-status" class="inline-flex px-3 py-1.5 rounded-full text-xs font-bold"></span>
</div>

<!-- Hạn chót (FR-07) -->
<div id="deadline-box" class="mt-4 rounded-2xl border p-4 text-sm font-medium"></div>

<!-- Lưới đăng ký -->
<div class="dash-card p-0 mt-6 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[720px]">
            <thead>
                <tr id="reg-head" class="bg-[#eee7db]/80 text-xs font-bold text-[#52525b]"></tr>
            </thead>
            <tbody id="reg-body" class="divide-y divide-[#f5efe6] text-sm">
                <tr><td class="py-10 text-center text-[#71717a]">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mt-6">
    <p class="text-sm text-[#52525b]">
        Đã chọn <strong id="reg-count">0</strong> ca · khoảng <strong id="reg-hours">0</strong> giờ
        <span class="text-[#9ca3af]">· Bấm tên ca để chọn cả tuần</span>
    </p>
    <div class="flex gap-3">
        <button type="button" id="reg-clear" class="btn-outline-brand">Bỏ chọn tất cả</button>
        <button type="button" id="reg-save" class="btn-primary px-6">Lưu nguyện vọng</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/shift-registration.js"></script>
{% endblock %}
