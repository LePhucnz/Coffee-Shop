<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Quản lý Nhân sự & Ca làm Quán Cà phê</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            200: '#eaddd7',
                            300: '#e0cec7',
                            400: '#d2bab0',
                            500: '#bfa094',
                            600: '#a18072',
                            700: '#854d0e', // Primary
                            800: '#713f12',
                            900: '#451a03',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/dashboard" class="flex items-center gap-2">
                    <span class="text-2xl">☕</span>
                    <span class="font-bold text-lg text-amber-900 tracking-tight">CoffeeShift HRM</span>
                </a>
                <span class="hidden sm:inline-block px-2.5 py-0.5 text-xs font-semibold bg-amber-100 text-amber-800 rounded-full">v1.2 (Sprint 1-3)</span>
            </div>

            <!-- User Menu -->
            <div class="flex items-center gap-4">
                <div id="user-info-box" class="flex items-center gap-2">
                    <div class="text-right">
                        <div id="nav-user-name" class="text-sm font-semibold text-gray-800">Đang tải...</div>
                        <div id="nav-user-role" class="text-xs text-amber-800 font-medium">---</div>
                    </div>
                    <div class="w-9 h-9 rounded-full bg-amber-800 text-white flex items-center justify-center font-bold text-sm" id="nav-avatar">
                        U
                    </div>
                </div>
                <button onclick="logout()" class="text-sm font-medium text-red-600 hover:text-red-800 hover:bg-red-50 px-3 py-1.5 rounded-lg transition-colors border border-red-200">
                    Đăng xuất
                </button>
            </div>
        </div>
    </header>

    <div class="flex-1 flex max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 gap-6">
        <!-- Sidebar Navigation -->
        <aside class="w-64 flex-shrink-0 hidden md:block">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sticky top-24">
                <nav class="space-y-1">
                    <a href="/dashboard" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg hover:bg-amber-50 hover:text-amber-900 text-gray-700 transition-colors {% if request.url.path == '/dashboard' %}bg-amber-100 text-amber-950 font-semibold{% endif %}">
                        <svg class="w-5 h-5 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                        Tổng quan (Dashboard)
                    </a>
                    <a href="/employees" id="nav-link-employees" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg hover:bg-amber-50 hover:text-amber-900 text-gray-700 transition-colors {% if request.url.path == '/employees' %}bg-amber-100 text-amber-950 font-semibold{% endif %}">
                        <svg class="w-5 h-5 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                        Hồ sơ Nhân sự (FR-04)
                    </a>
                    <a href="/contracts" class="flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg hover:bg-amber-50 hover:text-amber-900 text-gray-700 transition-colors {% if request.url.path == '/contracts' %}bg-amber-100 text-amber-950 font-semibold{% endif %}">
                        <svg class="w-5 h-5 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        Hợp đồng Lao động (FR-05)
                    </a>
                </nav>

                <div class="mt-6 pt-4 border-t border-gray-100">
                    <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-3 mb-2">Sprint tiếp theo</div>
                    <div class="px-3 py-2 text-xs text-gray-400 flex items-center justify-between">
                        <span>Sprint 4: Xếp ca</span>
                        <span class="bg-gray-100 px-1.5 py-0.5 rounded text-[10px]">Sắp ra mắt</span>
                    </div>
                    <div class="px-3 py-2 text-xs text-gray-400 flex items-center justify-between">
                        <span>Sprint 5: Chấm công</span>
                        <span class="bg-gray-100 px-1.5 py-0.5 rounded text-[10px]">Sắp ra mắt</span>
                    </div>
                    <div class="px-3 py-2 text-xs text-gray-400 flex items-center justify-between">
                        <span>Sprint 6: Tính lương</span>
                        <span class="bg-gray-100 px-1.5 py-0.5 rounded text-[10px]">Sắp ra mắt</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 min-w-0">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <script>
        // Update user badge on layout
        document.addEventListener("DOMContentLoaded", () => {
            const user = API.getUser();
            if (user) {
                const nameEl = document.getElementById("nav-user-name");
                const roleEl = document.getElementById("nav-user-role");
                const avatarEl = document.getElementById("nav-avatar");

                if (nameEl) nameEl.innerText = user.ho_ten || user.ten_dang_nhap;
                if (roleEl) roleEl.innerText = `Vai trò: ${user.ten_vai_tro || "Staff"}`;
                if (avatarEl) {
                    const initials = (user.ho_ten || user.ten_dang_nhap).substring(0, 1).toUpperCase();
                    avatarEl.innerText = initials;
                }

                // If Staff, hide or adjust admin menu items if desired
                if (user.ten_vai_tro === "Staff") {
                    const empNav = document.getElementById("nav-link-employees");
                    if (empNav) empNav.classList.add("hidden");
                }
            } else if (!window.location.pathname.includes("/login")) {
                window.location.href = "/login";
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
