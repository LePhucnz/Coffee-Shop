<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - QL Ca Làm</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
</head>
<body class="bg-[#fbf8f4] text-[#18181b] min-h-screen flex items-center justify-center p-4 sm:p-6 selection:bg-amber-100 selection:text-amber-900">

    <div class="w-full max-w-[440px]">
        <!-- FORGOT PASSWORD CARD (IMAGE 4) -->
        <div class="auth-card p-8 sm:p-10 fade-in">
            <!-- Icon Badge at Top -->
            <div class="text-center mb-6">
                <div class="w-14 h-14 rounded-full bg-[#fef3c7] text-[#cf6800] flex items-center justify-center mx-auto mb-4">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0110 0v4"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold text-[#18181b] tracking-tight">Đặt lại mật khẩu</h1>
                <p class="text-sm text-[#71717a] mt-2 leading-relaxed">
                    Nhập email đã đăng ký tài khoản của bạn để nhận liên kết xác nhận đặt lại mật khẩu mới.
                </p>
            </div>

            <!-- Forgot Password Form -->
            <form id="form-forgot" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-[#27272a] mb-1.5" for="forgot-email">
                        Email
                    </label>
                    <input type="email" id="forgot-email" required
                           class="form-input"
                           placeholder="example@gmail.com" />
                </div>

                <button type="submit" class="btn-primary w-full py-3.5 text-base mt-2">
                    Gửi liên kết
                </button>
            </form>

            <div class="mt-7 text-center">
                <a href="./login.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-[#27272a] hover:text-[#cf6800] transition-colors">
                    <span>←</span> Quay lại đăng nhập
                </a>
            </div>
        </div>
    </div>

    <script src="./js/auth.js"></script>
</body>
</html>
